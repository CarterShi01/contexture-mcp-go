name: Release Go module

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate semantic version, including leading v
        required: true
        type: string
      authorization:
        description: Type RELEASE APPROVED after separate maintainer authorization
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: go-module-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and create module tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: go-module
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: false
      - name: Require explicit release authorization
        env:
          RELEASE_AUTHORIZATION: ${{ inputs.authorization }}
        run: test "$RELEASE_AUTHORIZATION" = "RELEASE APPROVED"
      - run: go mod download
      - name: Verify module metadata is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go run ./internal/conformancecheck
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./internal/releasecheck "${{ inputs.version }}"
      - name: Create immutable release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_VERSION" --message "Release $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"
